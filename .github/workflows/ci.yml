name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Clippy · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone_test
          POSTGRES_DB: keystone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-features
      - name: Test
        # TEST_DATABASE_URL enables the integration suite (migration dry-run,
        # repositories). Tests self-skip when it is unset.
        env:
          TEST_DATABASE_URL: postgres://keystone:keystone_test@localhost:5432/keystone_test
        run: cargo test --all-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # Ignores are documented in .cargo/audit.toml, which cargo audit
        # auto-discovers from the repo root (the job's checkout dir). The
        # installed cargo-audit 0.22.x rejects an explicit --config path,
        # so rely on the documented default location. cargo audit exits
        # non-zero on any un-ignored vulnerability.
        run: cargo audit

  security-grep:
    name: Secrets-in-logs guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject logging of tokens/secrets
        run: |
          if grep -rnE "logger\.(info|debug|warn|error)\([^)]*(token|secret|password|refresh_token)" crates/; then
            echo "❌ Found a log line that may leak a secret. Audit logs must never contain tokens."
            exit 1
          fi
          echo "✓ No obvious secret logging detected."
