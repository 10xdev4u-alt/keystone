name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format · Clippy · Build · Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone_test
          POSTGRES_DB: keystone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-features
      - name: Test
        # TEST_DATABASE_URL enables the integration suite (migration dry-run,
        # repositories). Tests self-skip when it is unset.
        env:
          TEST_DATABASE_URL: postgres://keystone:keystone_test@localhost:5432/keystone_test
        run: cargo test --all-features

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        # Ignores are documented in .cargo/audit.toml, which cargo audit
        # auto-discovers from the repo root (the job's checkout dir). The
        # installed cargo-audit 0.22.x rejects an explicit --config path,
        # so rely on the documented default location. cargo audit exits
        # non-zero on any un-ignored vulnerability.
        run: cargo audit

  web-quality:
    name: Web lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + a11y tests
        run: npm run test
      - name: Production build
        run: npm run build

  spec-client-gate:
    name: OpenAPI spec → generated client in sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Regenerate client from spec
        run: bash scripts/generate-client.sh
      - name: Fail on uncommitted spec/client drift
        run: |
          if ! git diff --exit-code -- web/openapi.json web/src/api/generated.ts; then
            echo "::error::The OpenAPI spec or generated TS client changed. Run 'npm run gen:api' and commit the result."
            exit 1
          fi

  e2e:
    name: E2E · Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone_test
          POSTGRES_DB: keystone_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystone"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Build API
        run: cargo build --all-features
      - name: Run e2e smoke suite
        working-directory: web
        env:
          # Matches the postgres service container above.
          E2E_DATABASE_URL: postgres://keystone:keystone_test@localhost:5432/keystone_test
        run: npm run test:e2e

  security-grep:
    name: Secrets-in-logs guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject logging of tokens/secrets
        run: |
          if grep -rnE "logger\.(info|debug|warn|error)\([^)]*(token|secret|password|refresh_token)" crates/; then
            echo "❌ Found a log line that may leak a secret. Audit logs must never contain tokens."
            exit 1
          fi
          echo "✓ No obvious secret logging detected."
